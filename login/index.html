<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소마챔피언즈 · 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  @font-face{
    font-family:"CookieRun"; font-weight:400; font-display:swap;
    src:url("../font/1.CookieRun-공통/CookieRunFont_OTF/CookieRun%20Regular.otf") format("opentype");
  }
  @font-face{
    font-family:"CookieRun"; font-weight:700; font-display:swap;
    src:url("../font/1.CookieRun-공통/CookieRunFont_OTF/CookieRun%20Bold.otf") format("opentype");
  }

  :root{
    --primary:#F19A2F;                 /* 브랜드 주황 (버튼·포커스) */
    --ink-78:rgba(0,0,0,.78);
    --ink-58:rgba(0,0,0,.58);
    --line:#DDDDDD;
    --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --cookie:"CookieRun",var(--sans);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#fff; color:var(--ink-78); font-family:var(--sans);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* 713px 컨테이너: 카드(gap 40) + 푸터(gap 47) */
  .stack{ width:713px; display:flex; flex-direction:column; align-items:center; gap:47px; }
  .card{ width:360px; display:flex; flex-direction:column; align-items:center; gap:40px; }

  /* ── 로고 그룹 ─────────────────────────── */
  .logo-group{ display:flex; flex-direction:column; align-items:center; gap:13px; }
  .logo-slot{ position:relative; width:290px; height:42px; overflow:hidden; }
  /* 1280×720 comp을 크게 렌더 후 중앙 크롭 → 로고(571px)가 290px로 꽉 참 */
  #logo{ position:absolute; top:50%; left:50%; width:650px; height:366px; transform:translate(-50%,-50%); }
  .badge{
    border:1px solid var(--line); border-radius:4px; padding:6px 16px 4px;
    font-family:var(--sans); font-size:20px; line-height:1.5; letter-spacing:-.3px;
    color:var(--ink-58);
  }

  /* ── 폼 그룹 ───────────────────────────── */
  .form{ width:100%; display:flex; flex-direction:column; gap:16px; }
  .fields{ display:flex; flex-direction:column; gap:16px; }
  .field{
    display:flex; align-items:center; gap:6px;
    height:80px; background:#fff; border:4px solid var(--line); border-radius:4px;
    padding:10px 24px; transition:border-color .15s;
  }
  .field:focus-within{ border-color:var(--primary); }
  .field input{
    flex:1; min-width:0; border:none; outline:none; background:transparent;
    font-family:var(--cookie); font-size:20px; color:var(--ink-78); letter-spacing:0;
    caret-color:var(--primary);
  }
  .field input::placeholder{ color:rgba(0,0,0,.38); }
  /* 비밀번호 dot 렌더링: 굵은 caret 느낌의 브랜드 caret 유지 */
  .field input[type=password]{ letter-spacing:4px; }
  .eye{ width:48px; height:48px; display:grid; place-items:center; border:none; background:none; cursor:pointer; padding:0; }
  .eye svg{ width:40px; height:40px; display:block; }
  .eye .on{ display:none; }
  .eye.show .off{ display:none; }
  .eye.show .on{ display:block; }

  /* 아이디 저장 */
  .remember{ display:flex; align-items:center; gap:17px; cursor:pointer; user-select:none; }
  .check{ width:48px; height:48px; flex-shrink:0; }
  .check .box{ fill:#fff; stroke:var(--line); stroke-width:2; }
  .check .mark{ stroke:#fff; opacity:0; }
  .remember.checked .check .box{ fill:var(--line); stroke:var(--line); }
  .remember.checked .check .mark{ opacity:1; }
  .remember span{ font-family:var(--cookie); font-weight:700; font-size:20px; color:var(--ink-78); }

  /* 로그인 버튼 */
  .btn-login{
    position:relative; width:100%; min-width:200px; border:none; cursor:pointer;
    padding:32px 56px 40px; border-radius:16px; background:var(--primary);
    font-family:var(--cookie); font-weight:700; font-size:24px; color:#fff; line-height:1;
    box-shadow:0 8px 8px rgba(241,154,47,.3), inset 0 -8px 0 rgba(0,0,0,.16);
    transition:transform .06s, filter .15s;
  }
  .btn-login:hover{ filter:brightness(1.03); }
  .btn-login:active{ transform:translateY(2px); box-shadow:0 4px 6px rgba(241,154,47,.3), inset 0 -4px 0 rgba(0,0,0,.16); }

  /* 푸터 */
  .footer{
    font-family:var(--sans); font-size:16px; line-height:1.5; letter-spacing:-.3px;
    color:var(--ink-58); text-align:center;
  }
</style>
</head>
<body>
  <div class="stack">
    <div class="card">

      <div class="logo-group">
        <div class="logo-slot"><div id="logo"></div></div>
        <div class="badge">전자칠판</div>
      </div>

      <form class="form" onsubmit="event.preventDefault(); location.href='../whiteboard/index.html';">
        <div class="fields">
          <label class="field">
            <input type="text" id="userid" value="hongs" autocomplete="username" aria-label="아이디" autofocus>
          </label>
          <label class="field">
            <input type="password" id="userpw" value="password" autocomplete="current-password" aria-label="비밀번호">
            <button type="button" class="eye" id="eye" aria-label="비밀번호 표시">
              <!-- eye-close (숨김 상태) -->
              <svg class="off" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M5.708 4.292C5.318 3.902 4.684 3.902 4.294 4.292C3.904 4.682 3.904 5.316 4.294 5.706L11.292 12.704C7.942 14.982 5.448 18.546 4.562 22.796C4.45 23.336 4.796 23.866 5.336 23.98C5.876 24.094 6.406 23.746 6.52 23.206C7.328 19.336 9.65 16.128 12.736 14.15L15.908 17.322C14.148 18.594 13.002 20.664 13.002 23.002C13.002 26.868 16.136 30.002 20.002 30.002C22.34 30.002 24.41 28.856 25.682 27.096L34.296 35.71C34.686 36.1 35.32 36.1 35.71 35.71C36.1 35.32 36.1 34.686 35.71 34.296L5.71 4.296L5.708 4.292ZM24.238 25.654C23.354 27.064 21.786 28 20 28C17.238 28 15 25.762 15 23C15 21.214 15.938 19.646 17.346 18.762L24.238 25.654ZM20.246 16.004L26.994 22.752C26.866 19.082 23.914 16.13 20.246 16.004ZM20 12C18.86 12 17.742 12.148 16.668 12.426L15.062 10.82C16.626 10.288 18.29 10 20 10C27.386 10 33.884 15.346 35.44 22.796C35.552 23.336 35.206 23.866 34.666 23.98C34.126 24.094 33.596 23.746 33.482 23.206C32.116 16.656 26.412 12 20 12Z" fill="black" fill-opacity="0.58"/></svg>
              <!-- eye-open (표시 상태) -->
              <svg class="on" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 12C13.588 12 7.884 16.656 6.518 23.206C6.404 23.746 5.874 24.094 5.334 23.98C4.794 23.866 4.448 23.336 4.56 22.796C6.116 15.346 12.614 10 20 10C27.386 10 33.884 15.346 35.44 22.796C35.552 23.336 35.206 23.866 34.666 23.98C34.126 24.094 33.596 23.746 33.482 23.206C32.116 16.656 26.412 12 20 12Z" fill="black" fill-opacity="0.58"/><path d="M20 16C16.134 16 13 19.134 13 23C13 26.866 16.134 30 20 30C23.866 30 27 26.866 27 23C27 19.134 23.866 16 20 16ZM15 23C15 20.238 17.238 18 20 18C22.762 18 25 20.238 25 23C25 25.762 22.762 28 20 28C17.238 28 15 25.762 15 23Z" fill="black" fill-opacity="0.58"/></svg>
            </button>
          </label>
        </div>

        <div class="remember checked" id="remember" role="checkbox" aria-checked="true" tabindex="0">
          <svg class="check" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect class="box" x="1" y="1" width="46" height="46" rx="23"/>
            <path class="mark" d="M11 25L20 34L37.5 16.5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>아이디 저장</span>
        </div>

        <button type="submit" class="btn-login">로그인</button>
      </form>

    </div>

    <p class="footer">
      (주) 타임교육 서울특별시 강남구 봉은사로 442 (75th Avenue 빌딩)<br>
      대표이사 최문철 개인정보 보호책임자 양선학 email : mswitch@t-ime.com 사업자등록번호 206-86-58900
    </p>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
  // ── 로고 애니메이션: 인트로 1회 → 미세루프 ──
  const anim = lottie.loadAnimation({
    container: document.getElementById('logo'),
    renderer: 'svg',
    loop: false,
    autoplay: false,
    path: 'lottie/logo.json',
    rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
  });
  anim.addEventListener('DOMLoaded', () => {
    const markers = anim.markers || [];
    const loopStart = markers.length > 1 ? markers[1].time : 80; // 'loop' 마커 시작
    const end = anim.totalFrames;                                // op
    anim.playSegments([0, loopStart], true);                     // 인트로 1회
    anim.addEventListener('complete', function once() {
      anim.removeEventListener('complete', once);
      anim.loop = true;
      anim.playSegments([loopStart, end], true);                 // 미세루프 반복
    });
  });

  // ── 비밀번호 표시 토글 ──
  const eye = document.getElementById('eye');
  const pw = document.getElementById('userpw');
  eye.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.classList.toggle('show', show);
  });

  // ── 아이디 저장 체크 토글 ──
  const remember = document.getElementById('remember');
  const toggle = () => {
    const on = !remember.classList.contains('checked');
    remember.classList.toggle('checked', on);
    remember.setAttribute('aria-checked', String(on));
  };
  remember.addEventListener('click', toggle);
  remember.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
</script>
</body>
</html>
