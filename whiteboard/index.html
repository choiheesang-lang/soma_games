<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트 전자칠판 · 교재 뷰어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  html,body{margin:0;padding:0;background:#EDEDEA;}
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  a{color:#F19A2F;text-decoration:none;} a:hover{color:#D97F12;text-decoration:underline;}
  .brd-scroll::-webkit-scrollbar{height:10px;width:10px;}
  .brd-scroll::-webkit-scrollbar-thumb{background:#CFCFC9;border-radius:99px;border:2px solid transparent;background-clip:content-box;}
  .brd-scroll::-webkit-scrollbar-track{background:transparent;}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,16px);}to{opacity:1;transform:translate(-50%,0);}}
  @keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  /* ── 반응형 앱 셸 ── */
  .stage{width:100%;height:100dvh;background:#F4F4F1;display:flex;flex-direction:column;position:relative;overflow:hidden;font-family:Pretendard,sans-serif;color:#222824;}
  header,footer{flex:none;}
  .body{flex:1;min-height:0;display:flex;}
  .filterbar{flex:none;}
  .scrollarea{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px clamp(16px,3vw,32px) 40px;}

  .body{position:relative;}
  .side-head,.fdiv,.side-foot,.side-reopen{display:none;}  /* 기본 A안: 숨김 */

  /* ── A안(기본): 필터 상단 가로바 ── */
  .layout-A .body{flex-direction:column;}
  .layout-A .search-wrap{margin-left:auto;}          /* 검색 우측 정렬 */

  /* ── B안: 필터 좌측 고정 사이드바 ── */
  .layout-B .body{flex-direction:row;}
  .layout-B .filterbar{width:clamp(232px,21vw,288px);flex-direction:column;align-items:stretch;gap:14px;border-right:1px solid #E7E7E2;border-bottom:none;overflow-y:auto;transition:width .2s;}
  .layout-B .side-head{display:flex;align-items:center;justify-content:space-between;}
  .layout-B .side-title{font-size:14px;font-weight:800;color:#5B605A;}
  .layout-B .filterbar .fgroup{flex-direction:column;align-items:stretch;gap:10px;width:100%;}
  .layout-B .filterbar .fsel{width:100%;}
  .layout-B .reset-btn{align-self:flex-start;}
  .layout-B .fdiv{display:block;border-top:1px solid #ECECE6;}
  .layout-B .search-wrap{width:100%;}
  .layout-B .search-input{flex:1;min-width:0;}
  .layout-B .side-foot{display:block;margin-top:auto;padding-top:14px;border-top:1px solid #ECECE6;font-size:11.5px;line-height:1.6;color:#9AA09A;}
  .layout-B .side-foot a{font-weight:600;color:#C79A4A;}
  .layout-B footer{display:none;}                     /* 본문 하단 푸터바 숨김(사이드바로 이동) */
  /* 사이드바 접기 */
  .side-toggle{display:none;width:28px;height:28px;border:1.5px solid #E1E0DA;border-radius:8px;background:#fff;color:#8A8F89;font-size:15px;line-height:1;cursor:pointer;}
  .layout-B .side-toggle{display:block;}
  .layout-B.sidebar-collapsed .filterbar{width:0;min-width:0;padding:0;border-right:none;overflow:hidden;}
  .layout-B.sidebar-collapsed .side-reopen{display:inline-flex;}
  .side-reopen{position:absolute;left:12px;top:12px;z-index:20;align-items:center;gap:6px;height:38px;padding:0 14px;border:1.5px solid #DEDED8;border-radius:10px;background:#fff;font:inherit;font-size:13px;font-weight:700;color:#5B605A;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08);}
  @media (max-width:640px){
    .layout-B .body{flex-direction:column;}
    .layout-B .filterbar{width:auto;flex-direction:row;flex-wrap:wrap;gap:12px 14px;border-right:none;border-bottom:1px solid #E7E7E2;}
    .layout-B .filterbar .fgroup{flex-direction:row;flex-wrap:wrap;width:auto;}
    .layout-B .filterbar .fsel{width:auto;}
    .layout-B .side-head,.layout-B .fdiv,.layout-B .side-foot{display:none;}
    .layout-B .search-wrap{width:auto;margin-left:auto;}
    .layout-B .search-input{flex:none;width:clamp(160px,22vw,280px);}
  }

  /* ── 임시 A/B 시안 전환 토글 ── */
  .ab-toggle{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;align-items:center;gap:4px;padding:5px;background:#222824;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);}
  .ab-toggle .ab-label{color:#9AA09A;font-size:11px;font-weight:700;padding:0 6px;}
  .ab-toggle button{border:none;background:transparent;color:#CFCFC9;font:inherit;font-size:13px;font-weight:800;padding:6px 12px;border-radius:8px;cursor:pointer;}
  .ab-toggle button.on{background:#F19A2F;color:#fff;}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(16px,3vw,32px);height:70px;background:#fff;border-bottom:1px solid #E7E7E2;}
  header img{height:30px;width:auto;display:block;}
  .who{display:flex;align-items:center;gap:10px;} .who .av{width:36px;height:36px;border-radius:50%;background:#FFF0DE;color:#F19A2F;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .who span{font-size:15px;font-weight:600;white-space:nowrap;}
  .logout{height:38px;padding:0 16px;border:1.5px solid #DFDFDA;border-radius:10px;background:#fff;font:inherit;font-size:13.5px;font-weight:600;color:#555A55;cursor:pointer;white-space:nowrap;transition:.15s;}
  .logout:hover{border-color:#F19A2F;color:#F19A2F;}

  .filterbar{display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap;padding:14px clamp(16px,3vw,32px);background:#fff;border-bottom:1px solid #E7E7E2;}
  .fgroup{display:flex;align-items:center;gap:2px;flex-wrap:wrap;}
  .fsel{height:42px;padding:0 36px 0 14px;border:1.5px solid #DEDED8;border-radius:11px;background:#fff url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%228%22 viewBox=%220 0 12 8%22 fill=%22none%22><path d=%22M1 1.5L6 6.5L11 1.5%22 stroke=%22%237A7E7B%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>') no-repeat right 13px center;font:inherit;font-size:14px;font-weight:600;color:#222824;appearance:none;-webkit-appearance:none;cursor:pointer;}
  .fsel:focus{border-color:#F19A2F;outline:none;}
  .sep{color:#C4C4BE;font-size:15px;padding:0 3px;}
  .ftools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .reset-btn{height:42px;display:flex;align-items:center;gap:6px;padding:0 12px;border:none;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:#8A8F89;cursor:pointer;} .reset-btn:hover{color:#F19A2F;}
  .vtoggle{display:inline-flex;border:1.5px solid #DEDED8;border-radius:10px;overflow:hidden;background:#fff;}
  .vtoggle button{width:38px;height:38px;border:none;background:#fff;cursor:pointer;display:grid;place-items:center;color:#9AA09A;}
  .vtoggle button.on{background:#FFF3E4;color:#E08A18;}
  .search-wrap{position:relative;display:flex;align-items:center;gap:8px;} .search-wrap>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;}
  .search-input{width:clamp(180px,22vw,300px);height:42px;padding:0 16px 0 40px;border:1.5px solid #DEDED8;border-radius:11px;background:#fff;font:inherit;font-size:14px;font-weight:500;color:#222824;}
  .search-input:focus{border-color:#F19A2F;outline:none;}
  .search-btn{flex:none;height:42px;padding:0 16px;border:none;border-radius:11px;background:#F19A2F;color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;} .search-btn:hover{background:#E08A18;}

  /* 즐겨찾기 드래그 순서변경 */
  .fav-hint{font-size:12px;font-weight:600;color:#B0B4AD;margin-left:auto;}
  .card img,.thumb img{-webkit-user-drag:none;user-drag:none;}   /* 네이티브 이미지 드래그 차단 */
  #favArea .fav-strip .card{cursor:grab;touch-action:pan-y;user-select:none;}
  #favArea .fav-strip .card.dragging{opacity:.45;cursor:grabbing;}
  #favArea .fav-strip .card.drop-before{box-shadow:-3px 0 0 0 #F19A2F;}
  #favArea .fav-strip .card.drop-after{box-shadow:3px 0 0 0 #F19A2F;}

  .sec-h{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
  .sec-h h2{margin:0;font-size:18px;font-weight:800;}
  .cnt-badge{min-width:24px;height:24px;padding:0 8px;border-radius:99px;background:#FFF0DE;color:#E08A18;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}

  /* ── 카드 ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:22px 20px;}
  .card{cursor:pointer;}
  .card-img{position:relative;aspect-ratio:4/5;border-radius:14px;transition:transform .16s;}
  .card:hover .card-img{transform:translateY(-5px);}
  .fav-btn{position:absolute;top:9px;right:9px;width:34px;height:34px;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:3;}
  .game-badge{position:absolute;top:9px;left:9px;height:23px;padding:0 9px;border-radius:99px;background:#69BE00;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:4px;z-index:3;box-shadow:0 2px 6px rgba(105,190,0,.35);}
  .cnt-pill{position:absolute;bottom:9px;right:9px;height:26px;padding:0 11px;border-radius:99px;background:rgba(34,40,36,.86);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;z-index:3;}
  .card .title{margin-top:10px;font-size:14.5px;font-weight:700;line-height:1.32;}
  .card .meta{margin-top:3px;font-size:12px;color:#8C918B;}

  /* ── 흰색 3D 책 목업 (표지 없음) ── */
  .book3d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .book3d .bk{position:relative;height:88%;aspect-ratio:4/5;background:#fff;border-radius:3px 7px 7px 3px;
    box-shadow:0 10px 22px rgba(34,40,36,.16), inset 0 0 0 1px #ECECE6;
    background-image:linear-gradient(90deg,#EDEDE8 0,#EDEDE8 7px,#F6F6F2 7px,#fff 12px);}
  .book3d .bk::after{content:"";position:absolute;top:3px;bottom:3px;right:0;width:5px;border-radius:0 4px 4px 0;
    background:repeating-linear-gradient(90deg,#fff 0 1px,#E6E6E0 1px 2px);}   /* 페이지 엣지 */
  .book3d .bk .bk-t{position:absolute;left:16%;right:12%;top:16%;font-size:clamp(9px,1.05vw,15px);font-weight:800;color:#3A403B;line-height:1.28;word-break:keep-all;}
  .book3d .bk .bk-s{position:absolute;left:16%;bottom:12%;font-size:clamp(7px,.8vw,11px);font-weight:700;color:#AAB0A9;}
  /* 자동커버(표지 없음): 과목색 스파인 + 라벨 */
  .book3d .bk.auto{background-image:linear-gradient(90deg,var(--spine) 0 6px,color-mix(in srgb,var(--spine) 14%,#fff) 6px 11px,#fff 13px);}
  .book3d .bk.auto .bk-t{top:27%;}
  .book3d .bk .bk-subj{position:absolute;left:15%;right:12%;top:13%;font-size:clamp(8px,.82vw,11px);font-weight:800;letter-spacing:.2px;color:var(--spine);border-bottom:2px solid var(--spine);padding-bottom:4px;}
  .book3d .bk .bk-gs{position:absolute;left:15%;right:12%;bottom:12%;font-size:clamp(7px,.8vw,11px);font-weight:700;color:#9AA09A;}
  .book3d .bk .bk-cover{position:absolute;left:10px;top:5px;width:calc(100% - 16px);height:calc(100% - 10px);object-fit:cover;background:#fff;border-radius:1px 4px 4px 1px;}
  .card:hover .book3d .bk{box-shadow:0 16px 30px rgba(34,40,36,.22), inset 0 0 0 1px #ECECE6;}

  /* ── 즐겨찾기 가로 스트립 ── */
  .fav-strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;}
  .fav-strip .card{flex:none;width:150px;}
  .empty{display:flex;align-items:center;gap:12px;height:96px;padding:0 22px;border:2px dashed #DBDAD3;border-radius:14px;background:#FBFBF9;color:#7C817B;}
  .empty b{color:#F19A2F;}

  /* ── 리스트 행 ── */
  .rows{display:flex;flex-direction:column;gap:8px;}
  .row{display:flex;align-items:center;gap:14px;padding:9px 12px;background:#fff;border:1px solid #EAE9E4;border-radius:12px;cursor:pointer;transition:box-shadow .14s,border-color .14s;}
  .row:hover{box-shadow:0 6px 16px rgba(0,0,0,.08);}
  .thumb{position:relative;width:44px;height:55px;flex:none;border-radius:6px;overflow:hidden;background:#F4F4F0;}
  .thumb>img{width:100%;height:100%;object-fit:contain;display:block;}
  .thumb .mini-ph{width:100%;height:100%;display:grid;place-items:center;background:#F1F1EC;}
  .r-main{flex:1;min-width:0;} .r-title{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .r-meta{margin-top:3px;font-size:12.5px;color:#8C918B;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .r-actions{display:flex;align-items:center;gap:6px;flex:none;}
  .act{height:34px;padding:0 12px;border:1.5px solid #E4E3DD;border-radius:9px;background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:#5B605A;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .act:hover{border-color:#F19A2F;color:#F19A2F;}
  .act.primary{background:#F19A2F;border-color:#F19A2F;color:#fff;} .act.primary:hover{background:#E08A18;}
  .act.game{border-color:#CDE9B4;color:#4E8C1E;background:#F4FBEC;} .act.game:hover{border-color:#69BE00;color:#4E8C1E;}
  .rfav{width:34px;height:34px;border:1.5px solid #E4E3DD;border-radius:9px;background:#fff;cursor:pointer;display:grid;place-items:center;}
  .gtag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;background:#EAF6E1;color:#4E8C1E;font-size:11px;font-weight:800;}

  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 13px;border:1px solid #F0D9B8;border-radius:99px;background:#FFF7EC;font:inherit;font-size:13px;font-weight:700;color:#C77F14;cursor:pointer;} .chip:hover{background:#FCEBCF;}

  footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 clamp(16px,3vw,32px);min-height:40px;background:#222824;}
  footer span{font-size:12.5px;color:#8D938C;} footer a{font-size:12.5px;font-weight:600;color:#F8BD3B;}
</style>
</head>
<body>
<div class="stage layout-A">
  <header>
    <img src="assets/logo.svg" alt="로고">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <div class="fgroup">
        <select class="fsel" data-f="hq"><option value="">교육본사</option><option value="central">중앙교육본사</option><option value="south">남부교육본사</option></select>
        <span class="sep">›</span>
        <select class="fsel" data-f="branch"><option value="">지사</option><option value="seoul">서울지사</option><option value="gyeonggi">경기지사</option><option value="incheon">인천지사</option><option value="busan">부산지사</option></select>
      </div>
      <div class="who"><div class="av">홍</div><span><b style="font-weight:800;">홍길동</b> 선생님</span></div>
      <button class="logout" onclick="location.href='../login/index.html'">로그아웃</button>
    </div>
  </header>

  <div class="body">
  <div class="filterbar">
    <div class="side-head"><span class="side-title">필터</span><button class="side-toggle" id="sideToggle" title="사이드바 접기">‹</button></div>
    <div class="fgroup" style="gap:10px;">
      <select class="fsel" data-f="grade"><option value="">학년</option><option value="유아">유아</option><option value="cho1">초1</option><option value="cho2">초2</option><option value="cho3">초3</option><option value="cho4">초4</option><option value="cho5">초5</option><option value="cho6">초6</option></select>
      <select class="fsel" data-f="sem"><option value="">학기</option><option value="s1">1학기</option><option value="s2">2학기</option></select>
      <select class="fsel" data-f="year"><option value="">개정년도</option><option value="2022">2022 개정</option><option value="2015">2015 개정</option></select>
      <select class="fsel" data-f="subject"><option value="">과목</option><option value="연산">연산</option><option value="교과">교과</option><option value="사고력">사고력</option><option value="경시">경시</option></select>
      <button id="resetBtn" class="reset-btn" style="display:none;">↺ 초기화</button>
    </div>
    <div class="fdiv"></div>
    <div class="search-wrap">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="#9A9E98" stroke-width="2"/><path d="M14 14L18 18" stroke="#9A9E98" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" class="search-input" placeholder="교재·시리즈명 검색">
      <button class="search-btn" id="searchBtn">검색</button>
    </div>
    <div class="side-foot">
      <div>© 2025 스마트 전자칠판 · 교재 뷰어</div>
      <a href="#">Open Source License 확인</a>
    </div>
  </div>

  <button class="side-reopen" id="sideReopen" title="필터 열기">☰ 필터</button>
  <div class="scrollarea brd-scroll">
    <section id="favSection" style="margin-bottom:24px;background:#fff;border:1px solid #ECECE6;border-radius:16px;padding:18px 20px 20px;">
      <div class="sec-h"><span style="font-size:19px;color:#F19A2F;">★</span><h2>즐겨찾기</h2><span class="cnt-badge" id="favCount">0</span><span class="fav-hint">드래그로 순서 변경</span></div>
      <div id="favArea"></div>
    </section>
    <section>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <h2 id="headingText" style="margin:0;font-size:18px;font-weight:800;">전체 교재</h2>
        <span id="countLine" style="font-size:13.5px;font-weight:600;color:#8C918B;"></span>
        <div class="vtoggle" id="vtoggle" style="margin-left:auto;">
          <button data-view="list" title="리스트"><svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M6 4h9M6 9h9M6 14h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="2.5" cy="4" r="1.3" fill="currentColor"/><circle cx="2.5" cy="9" r="1.3" fill="currentColor"/><circle cx="2.5" cy="14" r="1.3" fill="currentColor"/></svg></button>
          <button data-view="grid" title="그리드"><svg width="17" height="17" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.4" fill="currentColor"/><rect x="10" y="2" width="6" height="6" rx="1.4" fill="currentColor"/><rect x="2" y="10" width="6" height="6" rx="1.4" fill="currentColor"/><rect x="10" y="10" width="6" height="6" rx="1.4" fill="currentColor"/></svg></button>
        </div>
      </div>
      <div id="chipsArea"></div>
      <div id="mainArea" style="margin-top:14px;"></div>
    </section>
  </div>
  </div>

  <footer><span>© 2025 스마트 전자칠판 · 교재 뷰어</span><a href="#">Open Source License 확인</a></footer>
  <div id="toastArea"></div>

  <!-- 임시: A/B 시안 전환 -->
  <div class="ab-toggle" id="abToggle" title="레이아웃 시안 전환(임시)">
    <span class="ab-label">시안</span>
    <button data-layout="A">A안</button>
    <button data-layout="B">B안</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
